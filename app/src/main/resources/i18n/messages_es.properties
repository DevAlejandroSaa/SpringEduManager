error.payment_required=Se requiere realizar un pago para completar la solicitud.
error.forbidden=No tiene permisos para acceder a este recurso.
error.not_found=El recurso solicitado no fue encontrado.
error.method_not_allowed=El método HTTP utilizado no está permitido para este recurso.
error.not_acceptable=El servidor no puede generar una respuesta compatible con los formatos solicitados.
error.proxy_authentication_required=Se requiere autenticación con el servidor proxy.
error.request_timeout=La solicitud excedió el tiempo máximo de espera.
error.conflict=La solicitud no puede completarse debido a un conflicto con el estado actual del recurso.
error.gone=El recurso solicitado ya no está disponible.
error.length_required=La solicitud debe incluir el encabezado Content-Length.
error.precondition_failed=No se cumplió una o más condiciones requeridas para procesar la solicitud.
error.payload_too_large=El contenido de la solicitud excede el tamaño máximo permitido.
error.uri_too_long=La URI solicitada excede la longitud máxima permitida.
error.unsupported_media_type=El tipo de contenido de la solicitud no es compatible con este recurso.
error.range_not_satisfiable=El rango solicitado no puede ser satisfecho.
error.expectation_failed=No se pudo cumplir una o más expectativas indicadas en la solicitud.
error.im_a_teapot=El servidor no puede procesar la solicitud debido a una solicitud no compatible.
error.misdirected_request=La solicitud fue dirigida a un servidor que no puede producir la respuesta solicitada.
error.unprocessable_entity=La solicitud contiene datos válidos, pero no puede ser procesada.
error.locked=El recurso solicitado se encuentra bloqueado.
error.failed_dependency=La solicitud no pudo completarse debido a un fallo en una operación de la que depende.
error.too_early=La solicitud no puede procesarse todavía.
error.upgrade_required=La solicitud requiere utilizar un protocolo diferente.
error.precondition_required=La solicitud requiere que se especifique una condición previa.
error.too_many_requests=Se ha excedido el límite de solicitudes permitido.
error.request_header_fields_too_large=Los encabezados de la solicitud exceden el tamaño máximo permitido.
error.unavailable_for_legal_reasons=El acceso al recurso está restringido por razones legales.
error.internal=Se produjo un error interno en el servidor.
error.not_implemented=La funcionalidad solicitada no está implementada.
error.bad_gateway=El servidor recibió una respuesta no válida de un servidor externo.
error.service_unavailable=El servicio no está disponible temporalmente.
error.gateway_timeout=El servidor externo no respondió dentro del tiempo establecido.
error.http_version_not_supported=La versión del protocolo HTTP utilizada no es compatible.
error.variant_also_negotiates=Se produjo un error de configuración al negociar una variante de la respuesta.
error.insufficient_storage=El servidor no dispone de espacio suficiente para completar la solicitud.
error.loop_detected=El servidor detectó un bucle durante el procesamiento de la solicitud.
error.not_extended=El servidor requiere información adicional para completar la solicitud.
error.network_authentication_required=Se requiere autenticación para acceder a la red.

